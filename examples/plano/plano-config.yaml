# examples/plano/plano-config.yaml
#
# plano (katanemo/plano, formerly archgw) in front of a local OVMS server.
# OVAT talks to plano exactly as it talked to OVMS directly; plano forwards
# the call on and adds an OpenTelemetry trace to every request.
#
#   planoai up examples/plano/plano-config.yaml
#
# Validated against planoai 0.4.27's own schema
# (planoai/data/plano_config_schema.yaml). model_providers accepts exactly:
# access_key, base_url, default, headers, http_host, model, name,
# passthrough_auth, provider_interface. Anything else is a hard validation
# error, which is what an earlier version of this file hit.

version: v0.4.0

# The door OVAT knocks on. type: model means a plain OpenAI-compatible proxy:
# one call in, one call out, no agent orchestration.
listeners:
  - type: model
    name: ovat_model_listener
    address: 0.0.0.0
    port: 12000

model_providers:
  - name: ovms-qwen3-8b
    provider_interface: openai      # OVMS speaks the OpenAI dialect
    # <provider>/<model_id>, and the slash is MANDATORY. plano splits on it
    # (config_generator.py: model_name.split("/")) and raises "Invalid model
    # name" outright if there is no prefix. It then strips the prefix and
    # sends only the part after it upstream, so OVMS receives exactly
    # "Qwen3-8B-int4-ov", which is what it serves.
    #
    # "ovms" is not one of plano's built-in providers, and for an unsupported
    # provider it REQUIRES base_url and provider_interface, both of which are
    # here. That is the supported way to point plano at any OpenAI-compatible
    # server it has never heard of.
    model: ovms/Qwen3-8B-int4-ov
    # THE ANSWER TO THE /v1-vs-/v3 SPIKE, and simpler than it first looked.
    # plano defaults to calling upstreams at /v1; OVMS serves its OpenAI API
    # under /v3. There is no separate prefix field to set: plano's CLI parses
    # base_url and lifts the path out of it into base_url_path_prefix
    # internally (config_generator.py, get_endpoint_and_port). So the whole
    # fix is putting /v3 in this URL, and it is character-for-character the
    # same value as OVAT's own model.ovms_url.
    base_url: http://127.0.0.1:8000/v3
    default: true

# OpenTelemetry for three lines. This is the W9-W10 telemetry item obtained by
# CONFIGURATION rather than code: every request through plano becomes an OTEL
# span with latency and token counts, and OVAT adds no OTEL dependency.
# NeMo spends ~3,900 lines on the equivalent.
#   planoai obs     live aggregate view
#   planoai trace   one request in depth
# The endpoint must match what `planoai obs` listens on, which it prints at
# startup as 0.0.0.0:4317.
tracing:
  random_sampling: 100
  opentracing_grpc_endpoint: http://localhost:4317

# The agent TUI with subagents and A2A: `ovat agent examples/agent/workflow.yml`
#
# One main agent on the GPU that can hand whole tasks to three specialists:
#   researcher  another OVAT workflow, run on this machine (examples/rag)
#   team_docs   an agent reached over A2A, here a second OVAT on this PC
#   cloud       a big model behind an OpenAI-compatible API; ASKS FIRST,
#               because the task text leaves the machine
#
# Run from the repository root (paths below are relative to it):
#   ovat serve examples/agent/workflow.yml          # OVMS, once
#   ovat index ./examples/rag/docs examples/rag/workflow.yml
#   ovat a2a serve examples/rag/workflow.yml --port 9100   # another terminal
#   set OVAT_A2A_TOKEN to the output of `ovat a2a token`  (same folder)
#   ovat agent examples/agent/workflow.yml
# See README.md in this folder for the PowerShell lines.

model:
  name: Qwen3.5-4B-int4-ov
  source_model: OpenVINO/Qwen3.5-4B-int4-ov
  device: GPU
  ovms_url: http://localhost:8000/v3
  tool_parser: qwen3coder
  model_repository_path: models
  request_timeout: 1200

tools:
  - name: search_docs
    type: builtin

agent:
  type: native
  max_iterations: 6
  system_prompt: >-
    You answer questions about the user's documents and can hand whole
    tasks to specialist subagents with the delegate tool. Call search_docs
    for questions about the user's files and cite the source. Use delegate
    when a subagent's description fits the task better, and give it the
    complete task, because it cannot see this chat.

rag:
  embeddings:
    provider: genai
    model: models/bge-small-en-v1.5
    device: CPU
    dim: 384
  retriever:
    provider: sqlite-vec
    db_path: examples/rag/rag_example.db

subagents:
  - name: researcher
    description: Searches the indexed OVAT notes and answers with citations.
    workflow: examples/rag/workflow.yml

  - name: team_docs
    description: The team's documentation agent, reached over A2A.
    a2a:
      url: http://127.0.0.1:9100
      token_env: OVAT_A2A_TOKEN

  # Any OpenAI-compatible API works: Mistral, OpenAI, Groq, a remote OVMS.
  # Change base_url and model, and put the key in the named variable.
  # permission is unset, so it ASKS before each task leaves the machine.
  - name: cloud
    description: A large cloud model for hard reasoning. Sees only the task.
    api:
      base_url: https://api.mistral.ai/v1
      model: mistral-small-latest
      api_key_env: MISTRAL_API_KEY

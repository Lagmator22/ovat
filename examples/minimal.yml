# examples/minimal.yml
# The "Minimal" profile: same agent, but tuned for an 8 GB / CPU-only laptop.
# Compare this with workflow.yml (the "Standard" GPU profile) and notice that
# moving from a 16 GB AI PC to a small laptop is a THREE-LINE change, not a
# rewrite. That is the abstraction OVAT is selling: the agent code never moves,
# only the config does.

model:
  name: Qwen3.5-0.8B-int4-ov   # smaller model that fits in ~2 GB
  device: CPU                           # no GPU needed
  ovms_url: http://localhost:8000/v3
  tool_parser: auto              # let OVMS read the chat template and choose
  # Only used by `ovat serve`:
  source_model: OpenVINO/Qwen3.5-0.8B-int4-ov
  model_repository_path: models

tools:
  - name: search_docs
    type: builtin

agent:
  type: native
  max_iterations: 6
  system_prompt: "You are a concise assistant. Use tools when needed."

# Without this block search_docs runs in STUB mode and returns fake text.
# bge-small is ~130 MB and runs happily on the same 8 GB CPU-only laptop,
# so the Minimal profile keeps real retrieval (matches the proposal's
# small-model + bge-small minimal tier from the proposal).
rag:
  embeddings:
    provider: genai
    model: models/bge-small-en-v1.5
    device: CPU
    dim: 384
  retriever:
    provider: sqlite-vec
    db_path: ovat_index.db
  chunk:
    size: 512
    overlap: 64

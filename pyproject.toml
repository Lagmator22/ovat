[project]
name = "ovat"
version = "0.2.0"
description = "Agentic Toolkit for AI PC with OpenVINO — turn agent boilerplate into one YAML + one command."
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "openvino",
  "openvino-genai",
  "openai",
  "typer",
  "pydantic>=2",
  "pyyaml",
  "pillow",
  "fastmcp",
  "sqlite-vec",
  # Imported directly (transcribe/vlm use numpy; the CLI renders with rich).
  # Declared here so we never depend on openvino/typer pulling them in for us.
  "numpy",
  "rich",
  # Peak-RSS measurement for `ovat run --trace` (the <8 GB memory criterion).
  "psutil",
]

# Extras keep the base install light AND encode the isolation contract:
# - langchain: the react engine (agent.type: react).
# - tui: the optional full-screen launcher. The plain CLI must work without
#   it — that is what makes the TUI removable without breaking anything.
[project.optional-dependencies]
langchain = ["langchain>=1", "langchain-openai>=1", "langgraph>=1"]
tui = ["textual", "pyfiglet"]
dev = ["pytest", "pytest-cov", "langchain>=1", "langchain-openai>=1",
       "langgraph>=1", "textual", "pyfiglet"]

[tool.pytest.ini_options]
markers = [
  "live: tests that need a running OVMS server (AI PC only, skipped elsewhere)",
  "rag: tests that need the bge-small embedding model on disk (auto-skip if absent)",
]

[project.scripts]
ovat = "ovat.cli.main:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Only package the `ovat` source tree. Without this, setuptools' flat-layout
# auto-discovery breaks when a non-package folder appears in the repo root
# (e.g. a `models/` download from `ovat serve`, or an extracted `ovms_linux/`).
[tool.setuptools.packages.find]
include = ["ovat*"]

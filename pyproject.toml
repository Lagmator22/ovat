[project]
name = "ovat"
version = "0.9.13"
description = "Agentic Toolkit for AI PC with OpenVINO: turn agent boilerplate into one YAML + one command."
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
  "openvino",
  "openvino-genai",
  "openai",
  "typer",
  "pydantic>=2",
  "pyyaml",
  "pillow",
  "fastmcp",
  "sqlite-vec",
  # Imported directly (transcribe/vlm use numpy; the CLI renders with rich).
  # Declared here so we never depend on openvino/typer pulling them in for us.
  "numpy",
  "rich",
  # Peak-RSS measurement for `ovat run --trace` (the <8 GB memory criterion).
  "psutil",
  # The `hf` CLI, so the documented "download an IR model" step actually
  # exists. `ovms --pull` covers the AI PC, but OVMS does not run on macOS,
  # where `ovat chat` still needs a model on disk -- and the README had no
  # working answer for how to get one there. Pure Python, no build step.
  "huggingface-hub",
]

# Extras keep the base install light AND encode the isolation contract:
# - langchain: the react engine (agent.type: react).
# - tui: the optional full-screen launcher. The plain CLI must work without
#   it; that is what makes the TUI removable without breaking anything.
[project.optional-dependencies]
# convert: optimum-cli, for turning a HuggingFace model into OpenVINO IR.
# The RAG quickstart cannot run without it -- there is no pre-converted
# bge-small in the OpenVINO org, so `optimum-cli export openvino` is the only
# way to get an embedder -- yet nothing installed it and the documented
# command was a plain "command not found" on any clean machine.
# An extra rather than a core dependency: it drags in torch, transformers and
# nncf, which is multiple GB that a user who only runs `ovat run` never needs.
convert = ["optimum-intel[openvino]>=2.0"]
langchain = ["langchain>=1", "langchain-openai>=1", "langgraph>=1"]
llamaindex = ["llama-index-core>=0.14", "llama-index-llms-openai-like>=0.5"]
openai-agents = ["openai-agents>=0.1"]
tui = ["textual", "pyfiglet"]
dev = ["pytest", "pytest-cov", "langchain>=1", "langchain-openai>=1",
       "langgraph>=1", "llama-index-core>=0.14",
       "llama-index-llms-openai-like>=0.5", "openai-agents>=0.1",
       "textual", "pyfiglet",
       # tomllib is stdlib from 3.11; on 3.10, which we support and advertise,
       # the packaging tests need it under its original name.
       "tomli; python_version < '3.11'"]

[tool.pytest.ini_options]
# Collect ONLY our own tests. The README tells users to unpack OVMS into the
# clone (<repo>/ovms), and the python_on build ships a full CPython whose
# site-packages carries setuptools' own test suite -- so a bare `pytest -q`
# in a repo set up exactly as documented died with 37 collection errors out
# of ovms/python/Lib/site-packages/. Found on the AI PC, 2026-08-03.
testpaths = ["tests"]
norecursedirs = ["ovms", "models", ".venv", "build", "*.egg-info"]
markers = [
  "live: tests that need a running OVMS server (AI PC only, skipped elsewhere)",
  "rag: tests that need the bge-small embedding model on disk (auto-skip if absent)",
]

[project.scripts]
ovat = "ovat.cli.main:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Only package the `ovat` source tree. Without this, setuptools' flat-layout
# auto-discovery breaks when a non-package folder appears in the repo root
# (e.g. a `models/` download from `ovat serve`, or an extracted `ovms_linux/`).
[tool.setuptools.packages.find]
include = ["ovat*"]

[tool.setuptools.package-data]
ovat = ["assets/*.gif", "assets/*.png"]

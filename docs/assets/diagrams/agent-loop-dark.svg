<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 396" width="880" height="396" role="img" aria-labelledby="t d"><title id="t">The agent loop</title><desc id="d">Your question goes to the model. If its reply asks for a tool, the tool runs as plain Python on your machine and its result joins the chat, and the model is asked again. A reply with no tool call is the answer, returned with its sources. The loop stops after max_iterations rounds, 10 by default.</desc><style>
svg{--text:#E6EDF3;--sub:#9AA7B4;--card:#161B22;--card2:#0F141A;--border:#30363D;--line:#6E7681;--accent:#00C7FD;--soft:rgba(0,199,253,0.08);--purple:#A98BFF;--ok:#3DD68C;--oktext:#3DD68C;--warn:#FFC107;--warntext:#FFC107;--halo:rgba(0,199,253,0.25);--mono:#00C7FD}
text{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;fill:var(--text)}
.title{font-weight:650}
.mono-title,.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
.mono{fill:var(--mono);font-size:13px}
.sub{fill:var(--sub);font-size:12.5px}
.small{fill:var(--sub);font-size:11.5px}
.cap{font-size:13px;font-weight:600;fill:var(--text)}
.num{fill:#fff;font-size:11.5px;font-weight:700;text-anchor:middle}
.box{fill:var(--card);stroke:var(--border);stroke-width:1.2}
.box2{fill:var(--card2);stroke:var(--border);stroke-width:1.2}
.group{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}
.link{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-ok{fill:none;stroke:var(--ok);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-purple{fill:none;stroke:var(--purple);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.solid{fill:none;stroke:var(--line);stroke-width:1.6}
.hl{fill:var(--soft);stroke:url(#brand);stroke-width:4}
.page{fill:var(--card);stroke:var(--accent);stroke-width:1.5}
.pagelines{stroke:var(--accent);stroke-width:1.2;fill:none}
.arrowhead{fill:var(--line)}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes q{0.00%{opacity:0} 1.00%{opacity:1} 10.00%{opacity:1} 12.50%{opacity:0} 100.00%{opacity:0}}.q{animation:q 10s linear infinite}@keyframes m1{0.00%{opacity:0} 8.50%{opacity:0} 11.00%{opacity:1} 20.00%{opacity:1} 22.50%{opacity:0} 100.00%{opacity:0}}.m1{animation:m1 10s linear infinite}@keyframes t{0.00%{opacity:0} 29.50%{opacity:0} 32.00%{opacity:1} 42.00%{opacity:1} 44.50%{opacity:0} 100.00%{opacity:0}}.t{animation:t 10s linear infinite}@keyframes a{0.00%{opacity:0} 75.50%{opacity:0} 78.00%{opacity:1} 90.00%{opacity:1} 92.50%{opacity:0} 100.00%{opacity:0}}.a{animation:a 10s linear infinite}@keyframes m2{0.00%{opacity:0} 54.50%{opacity:0} 57.00%{opacity:1} 66.00%{opacity:1} 68.50%{opacity:0} 100.00%{opacity:0}}.m2{animation:m2 10s linear infinite}
@media (prefers-reduced-motion: reduce){.fx{display:none}*{animation:none!important}}
</style><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0068B5"/><stop offset="0.55" stop-color="#00C7FD"/><stop offset="1" stop-color="#8F5CFF"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="268.5" y="108.5" width="183" height="143" rx="13.5" class="hl m2" opacity="0"/><rect x="18.5" y="270.5" width="173" height="87" rx="13.5" class="hl a" opacity="0"/><rect x="638.5" y="108.5" width="223" height="143" rx="13.5" class="hl t" opacity="0"/><rect x="268.5" y="108.5" width="183" height="143" rx="13.5" class="hl m1" opacity="0"/><rect x="18.5" y="108.5" width="173" height="87" rx="13.5" class="hl q" opacity="0"/><text x="20" y="30" class="mono">$ ovat run workflow.yml -i "what is said in sample.wav?"</text><path d="M450 140C510 50 580 50 636 136" class="link-purple" marker-end="url(#arrow)"/><path d="M640 222C580 310 510 310 454 226" class="link-ok" marker-end="url(#arrow)"/><path d="M190 152L266 168" class="link" marker-end="url(#arrow)"/><path d="M270 236L196 290" class="link" marker-end="url(#arrow)"/><text x="545" y="46" class="small" text-anchor="middle">the reply asks for a tool</text><text x="545" y="63" class="mono" text-anchor="middle" style="fill:var(--purple);font-size:12.5px">transcribe(path="sample.wav")</text><text x="545" y="312" class="small" text-anchor="middle">the result joins the chat,</text><text x="545" y="328" class="small" text-anchor="middle">and the model is asked again</text><text x="214" y="300" class="small">no tool call in the reply:</text><text x="214" y="316" class="small">that reply is the answer</text><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0100;0.1200;0.1400;1.0000" keyPoints="0.0000;0.0000;1.0000;1.0000;1.0000" path="M190 152 L360 180"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0099;0.0300;0.1200;0.1401;1.0000" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--purple)" opacity="0.22"/><circle r="6" fill="var(--purple)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.1800;0.3000;0.3400;0.3600;1.0000" keyPoints="0.0000;0.0000;0.6745;1.0000;1.0000;1.0000" path="M450 140 C510 50 580 50 640 140 L750 180"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.1799;0.2000;0.3400;0.3601;1.0000" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--ok)" opacity="0.22"/><circle r="6" fill="var(--ok)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.4100;0.4500;0.5600;0.5900;0.6100;1.0000" keyPoints="0.0000;0.0000;0.2573;0.7830;1.0000;1.0000;1.0000" path="M750 180 L640 222 C580 310 510 310 450 222 L360 180"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.4099;0.4300;0.5900;0.6101;1.0000" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--ok)" opacity="0.22"/><circle r="6" fill="var(--ok)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.6500;0.7800;0.8200;1.0000" keyPoints="0.0000;0.0000;1.0000;1.0000;1.0000" path="M360 180 L270 236 L190 290 L105 314"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.6499;0.6700;0.8000;0.8201;1.0000" values="0;0;1;1;0;0"/></g><g class="card"><rect x="20" y="110" width="170" height="84" rx="12" class="box"/><circle cx="40" cy="110" r="10.5" fill="url(#brand)"/><text x="40" y="114.2" class="num">1</text><text x="34" y="136" class="title" style="font-size:14.5px">Your question</text><text x="34" y="156" class="sub">&quot;what is said in</text><text x="34" y="173" class="sub">sample.wav?&quot;</text></g><g class="card"><rect x="270" y="110" width="180" height="140" rx="12" class="box"/><circle cx="290" cy="110" r="10.5" fill="url(#brand)"/><text x="290" y="114.2" class="num">2</text><text x="284" y="140" class="title" style="font-size:14.5px">Model</text><text x="284" y="160" class="sub">on OVMS. It reads the</text><text x="284" y="177" class="sub">chat so far and the</text><text x="284" y="194" class="sub">tool list, then</text><text x="284" y="211" class="sub">writes a reply</text></g><g class="card"><rect x="640" y="110" width="220" height="140" rx="12" class="box"/><circle cx="660" cy="110" r="10.5" fill="url(#brand)"/><text x="660" y="114.2" class="num">3</text><text x="654" y="140" class="title" style="font-size:14.5px">Tool runs</text><text x="654" y="160" class="sub">plain Python on your</text><text x="654" y="177" class="sub">machine: transcribe,</text><text x="654" y="194" class="sub">search_docs,</text><text x="654" y="211" class="sub">describe_image or MCP</text></g><g class="card"><rect x="20" y="272" width="170" height="84" rx="12" class="box"/><circle cx="40" cy="272" r="10.5" fill="url(#brand)"/><text x="40" y="276.2" class="num">4</text><text x="34" y="298" class="title" style="font-size:14.5px">Answer</text><text x="34" y="318" class="sub">plus the sources</text><text x="34" y="335" class="sub">it used</text></g><text x="20" y="384" class="small">Stops when a reply has no tool call, or after max_iterations rounds (10 by default). A tool that fails sends back an error message, not a crash.</text></svg>

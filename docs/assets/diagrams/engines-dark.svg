<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" width="880" height="382" role="img" aria-labelledby="t d"><title id="t">Four engines, one backend</title><desc id="d">workflow.yml sets agent.type to native, react (LangChain), llamaindex or openai-agents. All four engines talk to the same OVMS server with the same model, tools and /v3 endpoint. Only native is built in; the others need a pip extra.</desc><style>
svg{--text:#E6EDF3;--sub:#9AA7B4;--card:#161B22;--card2:#0F141A;--border:#30363D;--line:#6E7681;--accent:#00C7FD;--soft:rgba(0,199,253,0.08);--purple:#A98BFF;--ok:#3DD68C;--oktext:#3DD68C;--warn:#FFC107;--warntext:#FFC107;--halo:rgba(0,199,253,0.25);--mono:#00C7FD}
text{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;fill:var(--text)}
.title{font-weight:650}
.mono-title,.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
.mono{fill:var(--mono);font-size:13px}
.sub{fill:var(--sub);font-size:12.5px}
.small{fill:var(--sub);font-size:11.5px}
.cap{font-size:13px;font-weight:600;fill:var(--text)}
.num{fill:#fff;font-size:11.5px;font-weight:700;text-anchor:middle}
.box{fill:var(--card);stroke:var(--border);stroke-width:1.2}
.box2{fill:var(--card2);stroke:var(--border);stroke-width:1.2}
.group{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}
.link{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-ok{fill:none;stroke:var(--ok);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-purple{fill:none;stroke:var(--purple);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.solid{fill:none;stroke:var(--line);stroke-width:1.6}
.hl{fill:var(--soft);stroke:url(#brand);stroke-width:4}
.page{fill:var(--card);stroke:var(--accent);stroke-width:1.5}
.pagelines{stroke:var(--accent);stroke-width:1.2;fill:none}
.arrowhead{fill:var(--line)}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes v0{0.00%{opacity:1} 24.58%{opacity:1} 25.00%{opacity:0} 99.58%{opacity:0} 100.00%{opacity:1}}.v0{animation:v0 12s linear infinite}@keyframes v1{0.00%{opacity:0} 24.58%{opacity:0} 25.00%{opacity:1} 49.58%{opacity:1} 50.00%{opacity:0} 100.00%{opacity:0}}.v1{animation:v1 12s linear infinite}@keyframes v2{0.00%{opacity:0} 49.58%{opacity:0} 50.00%{opacity:1} 74.58%{opacity:1} 75.00%{opacity:0} 100.00%{opacity:0}}.v2{animation:v2 12s linear infinite}@keyframes v3{0.00%{opacity:0} 74.58%{opacity:0} 75.00%{opacity:1} 99.58%{opacity:1} 100.00%{opacity:0}}.v3{animation:v3 12s linear infinite}@keyframes e0{0.00%{opacity:0} 3.75%{opacity:0} 5.83%{opacity:1} 15.00%{opacity:1} 17.08%{opacity:0} 100.00%{opacity:0}}.e0{animation:e0 12s linear infinite}@keyframes e1{0.00%{opacity:0} 28.75%{opacity:0} 30.83%{opacity:1} 40.00%{opacity:1} 42.08%{opacity:0} 100.00%{opacity:0}}.e1{animation:e1 12s linear infinite}@keyframes e2{0.00%{opacity:0} 53.75%{opacity:0} 55.83%{opacity:1} 65.00%{opacity:1} 67.08%{opacity:0} 100.00%{opacity:0}}.e2{animation:e2 12s linear infinite}@keyframes e3{0.00%{opacity:0} 78.75%{opacity:0} 80.83%{opacity:1} 90.00%{opacity:1} 92.08%{opacity:0} 100.00%{opacity:0}}.e3{animation:e3 12s linear infinite}@keyframes o{0.00%{opacity:0} 15.42%{opacity:0} 17.50%{opacity:1} 22.50%{opacity:1} 24.58%{opacity:0} 40.42%{opacity:0} 42.50%{opacity:1} 47.50%{opacity:1} 49.58%{opacity:0} 65.42%{opacity:0} 67.50%{opacity:1} 72.50%{opacity:1} 74.58%{opacity:0} 90.42%{opacity:0} 92.50%{opacity:1} 97.50%{opacity:1} 99.58%{opacity:0} 100.00%{opacity:0}}.o{animation:o 12s linear infinite}
@media (prefers-reduced-motion: reduce){.fx{display:none}*{animation:none!important}}
</style><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0068B5"/><stop offset="0.55" stop-color="#00C7FD"/><stop offset="1" stop-color="#8F5CFF"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="688.5" y="108.5" width="173" height="133" rx="13.5" class="hl o" opacity="0"/><rect x="308.5" y="264.5" width="293" height="61" rx="13.5" class="hl e3" opacity="0"/><rect x="308.5" y="192.5" width="293" height="61" rx="13.5" class="hl e2" opacity="0"/><rect x="308.5" y="120.5" width="293" height="61" rx="13.5" class="hl e1" opacity="0"/><rect x="308.5" y="48.5" width="293" height="61" rx="13.5" class="hl e0" opacity="0"/><text x="20" y="30" class="mono">agent.type picks the engine. Nothing else in the file changes.</text><path d="M210 175C260 175 260 79 306 79" class="link" marker-end="url(#arrow)"/><path d="M600 79C645 79 645 175 686 175" class="link" marker-end="url(#arrow)"/><path d="M210 175C260 175 260 151 306 151" class="link" marker-end="url(#arrow)"/><path d="M600 151C645 151 645 175 686 175" class="link" marker-end="url(#arrow)"/><path d="M210 175C260 175 260 223 306 223" class="link" marker-end="url(#arrow)"/><path d="M600 223C645 223 645 175 686 175" class="link" marker-end="url(#arrow)"/><path d="M210 175C260 175 260 295 306 295" class="link" marker-end="url(#arrow)"/><path d="M600 295C645 295 645 175 686 175" class="link" marker-end="url(#arrow)"/><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0167;0.0667;0.1333;0.1833;0.2167;1.0000" keyPoints="0.1199;0.1199;0.3150;0.7013;0.8868;1.0000;1.0000" path="M120 175 L210 175 C260 175 260 79 310 79 L600 79 C645 79 645 175 690 175 L775 175"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.0166;0.0333;0.2000;0.2167;1.0000" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.2667;0.3167;0.3833;0.4333;0.4667;1.0000" keyPoints="0.1357;0.1357;0.2924;0.7296;0.8719;1.0000;1.0000" path="M120 175 L210 175 C260 175 260 151 310 151 L600 151 C645 151 645 175 690 175 L775 175"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.2666;0.2833;0.4500;0.4667;1.0000" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.5167;0.5667;0.6333;0.6833;0.7167;1.0000" keyPoints="0.1314;0.1314;0.2984;0.7217;0.8759;1.0000;1.0000" path="M120 175 L210 175 C260 175 260 223 310 223 L600 223 C645 223 645 175 690 175 L775 175"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.5166;0.5333;0.7000;0.7167;1.0000" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.7667;0.8167;0.8833;0.9333;0.9667;1.0000" keyPoints="0.1141;0.1141;0.3236;0.6911;0.8923;1.0000;1.0000" path="M120 175 L210 175 C260 175 260 295 310 295 L600 295 C645 295 645 175 690 175 L775 175"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.7666;0.7833;0.9500;0.9667;1.0000" values="0;0;1;1;0;0"/></g><g class="card"><rect x="20" y="120" width="190" height="110" rx="12" class="box"/><text x="34" y="150" class="title mono-title" style="font-size:14px">workflow.yml</text></g><text x="34" y="176" class="mono" style="fill:var(--sub)">agent:</text><text x="50" y="196" class="mono" style="fill:var(--sub)">type:</text><text x="98" y="196" class="mono v0" style="font-weight:700" opacity="1">native</text><text x="98" y="196" class="mono v1" style="font-weight:700" opacity="0">react</text><text x="98" y="196" class="mono v2" style="font-weight:700" opacity="0">llamaindex</text><text x="98" y="196" class="mono v3" style="font-weight:700" opacity="0">openai-agents</text><g class="card"><rect x="310" y="50" width="290" height="58" rx="12" class="box"/><text x="324" y="74" class="title mono-title" style="font-size:14px">native</text><text x="324" y="94" class="sub">OVAT's own loop. Records tokens per turn.</text><text x="586" y="74" class="small mono" text-anchor="end" style="font-size:10.5px;fill:var(--sub)">built in</text></g><g class="card"><rect x="310" y="122" width="290" height="58" rx="12" class="box"/><text x="324" y="146" class="title mono-title" style="font-size:14px">react</text><text x="324" y="166" class="sub">LangChain</text><text x="586" y="146" class="small mono" text-anchor="end" style="font-size:10.5px;fill:var(--sub)">ovat[langchain]</text></g><g class="card"><rect x="310" y="194" width="290" height="58" rx="12" class="box"/><text x="324" y="218" class="title mono-title" style="font-size:14px">llamaindex</text><text x="324" y="238" class="sub">LlamaIndex FunctionAgent</text><text x="586" y="218" class="small mono" text-anchor="end" style="font-size:10.5px;fill:var(--sub)">ovat[llamaindex]</text></g><g class="card"><rect x="310" y="266" width="290" height="58" rx="12" class="box"/><text x="324" y="290" class="title mono-title" style="font-size:14px">openai-agents</text><text x="324" y="310" class="sub">OpenAI Agents SDK</text><text x="586" y="290" class="small mono" text-anchor="end" style="font-size:10.5px;fill:var(--sub)">ovat[openai-agents]</text></g><g class="card"><rect x="690" y="110" width="170" height="130" rx="12" class="box"/><text x="704" y="140" class="title" style="font-size:14.5px">One OVMS server</text><text x="704" y="160" class="sub">same model</text><text x="704" y="177" class="sub">same tools</text><text x="704" y="194" class="sub">same /v3 endpoint</text></g><text x="20" y="352" class="small">Every engine builds its tool arguments from the same SCHEMA, so a tool behaves the same on all four.</text><text x="20" y="370" class="small">ovat bench sends one question through all four, against the same server, and prints them side by side.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 326" width="880" height="326" role="img" aria-labelledby="t d"><title id="t">How one ovat run request flows</title><desc id="d">workflow.yml is checked against a strict schema, the agent factory wires the model, tools and search, one of four engines runs the loop, and the model runs either on an OVMS server (Windows or Linux, with tool calls) or in-process through openvino_genai (any OS, no tools), on an Intel CPU, GPU or NPU. The answer comes back with its sources.</desc><style>
svg{--text:#E6EDF3;--sub:#9AA7B4;--card:#161B22;--card2:#0F141A;--border:#30363D;--line:#6E7681;--accent:#00C7FD;--soft:rgba(0,199,253,0.08);--purple:#A98BFF;--ok:#3DD68C;--oktext:#3DD68C;--warn:#FFC107;--warntext:#FFC107;--halo:rgba(0,199,253,0.25);--mono:#00C7FD}
text{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;fill:var(--text)}
.title{font-weight:650}
.mono-title,.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
.mono{fill:var(--mono);font-size:13px}
.sub{fill:var(--sub);font-size:12.5px}
.small{fill:var(--sub);font-size:11.5px}
.cap{font-size:13px;font-weight:600;fill:var(--text)}
.num{fill:#fff;font-size:11.5px;font-weight:700;text-anchor:middle}
.box{fill:var(--card);stroke:var(--border);stroke-width:1.2}
.box2{fill:var(--card2);stroke:var(--border);stroke-width:1.2}
.group{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}
.link{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-ok{fill:none;stroke:var(--ok);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-purple{fill:none;stroke:var(--purple);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.solid{fill:none;stroke:var(--line);stroke-width:1.6}
.hl{fill:var(--soft);stroke:url(#brand);stroke-width:4}
.page{fill:var(--card);stroke:var(--accent);stroke-width:1.5}
.pagelines{stroke:var(--accent);stroke-width:1.2;fill:none}
.arrowhead{fill:var(--line)}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes h0{0.00%{opacity:0} 0.56%{opacity:0} 3.33%{opacity:1} 12.22%{opacity:1} 15.00%{opacity:0} 100.00%{opacity:0}}.h0{animation:h0 9s linear infinite}@keyframes h1{0.00%{opacity:0} 13.89%{opacity:0} 16.67%{opacity:1} 26.67%{opacity:1} 29.44%{opacity:0} 100.00%{opacity:0}}.h1{animation:h1 9s linear infinite}@keyframes h2{0.00%{opacity:0} 29.44%{opacity:0} 32.22%{opacity:1} 42.22%{opacity:1} 45.00%{opacity:0} 100.00%{opacity:0}}.h2{animation:h2 9s linear infinite}@keyframes h3{0.00%{opacity:0} 45.00%{opacity:0} 47.78%{opacity:1} 57.78%{opacity:1} 60.56%{opacity:0} 100.00%{opacity:0}}.h3{animation:h3 9s linear infinite}@keyframes h4{0.00%{opacity:0} 60.56%{opacity:0} 63.33%{opacity:1} 73.33%{opacity:1} 76.11%{opacity:0} 100.00%{opacity:0}}.h4{animation:h4 9s linear infinite}@keyframes h5{0.00%{opacity:0} 87.22%{opacity:0} 90.00%{opacity:1} 98.89%{opacity:1} 101.67%{opacity:0}}.h5{animation:h5 9s linear infinite}
@media (prefers-reduced-motion: reduce){.fx{display:none}*{animation:none!important}}
</style><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0068B5"/><stop offset="0.55" stop-color="#00C7FD"/><stop offset="1" stop-color="#8F5CFF"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="18.5" y="224.5" width="143" height="31" rx="15" class="hl h5" opacity="0"/><rect x="718.5" y="58.5" width="143" height="75" rx="13.5" class="hl h4" opacity="0"/><rect x="543.5" y="76.5" width="143" height="107" rx="13.5" class="hl h3" opacity="0"/><rect x="368.5" y="76.5" width="143" height="107" rx="13.5" class="hl h2" opacity="0"/><rect x="193.5" y="76.5" width="143" height="107" rx="13.5" class="hl h1" opacity="0"/><rect x="18.5" y="76.5" width="143" height="107" rx="13.5" class="hl h0" opacity="0"/><text x="20" y="30" class="mono">$ ovat run workflow.yml -i "what do my notes say?"</text><path d="M712 240H164" class="link-ok" marker-end="url(#arrow)"/><rect x="710" y="50" width="160" height="180" rx="14" class="group"/><text x="790" y="44" class="small" text-anchor="middle">runs the model</text><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0111;0.0889;0.1778;0.2444;0.3333;0.4000;0.4889;0.5556;0.6444;0.7222;1.0000" keyPoints="0.0000;0.0000;0.0000;0.2486;0.2486;0.4971;0.4971;0.7457;0.7457;1.0000;1.0000;1.0000" path="M90 130 L640 130 L790 95"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0.0000;0.0110;0.0333;0.7000;0.7223;1.0000" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--ok)" opacity="0.22"/><circle r="6" fill="var(--ok)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="9s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.7333;0.9111;0.9556;1.0000" keyPoints="0.0000;0.0000;1.0000;1.0000;1.0000" path="M712 240 L160 240"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0.0000;0.7332;0.7556;0.9333;0.9557;1.0000" values="0;0;1;1;0;0"/></g><g class="card"><rect x="20" y="78" width="140" height="104" rx="12" class="box"/><circle cx="40" cy="78" r="10.5" fill="url(#brand)"/><text x="40" y="82.2" class="num">1</text><text x="34" y="108" class="title mono-title" style="font-size:14px">workflow.yml</text><text x="34" y="128" class="sub">the one file</text><text x="34" y="145" class="sub">you write</text></g><g class="card"><rect x="195" y="78" width="140" height="104" rx="12" class="box"/><circle cx="215" cy="78" r="10.5" fill="url(#brand)"/><text x="215" y="82.2" class="num">2</text><text x="209" y="108" class="title" style="font-size:14.5px">Check</text><text x="209" y="128" class="sub">strict schema,</text><text x="209" y="145" class="sub">typos are errors</text></g><g class="card"><rect x="370" y="78" width="140" height="104" rx="12" class="box"/><circle cx="390" cy="78" r="10.5" fill="url(#brand)"/><text x="390" y="82.2" class="num">3</text><text x="384" y="108" class="title" style="font-size:14.5px">Agent factory</text><text x="384" y="128" class="sub">wires the model,</text><text x="384" y="145" class="sub">tools and search</text></g><g class="card"><rect x="545" y="78" width="140" height="104" rx="12" class="box"/><circle cx="565" cy="78" r="10.5" fill="url(#brand)"/><text x="565" y="82.2" class="num">4</text><text x="559" y="108" class="title" style="font-size:14.5px">Engine</text><text x="559" y="128" class="sub">native, react,</text><text x="559" y="145" class="sub">llamaindex or</text><text x="559" y="162" class="sub">openai-agents</text></g><g class="card"><rect x="720" y="60" width="140" height="72" rx="12" class="box"/><circle cx="740" cy="60" r="10.5" fill="url(#brand)"/><text x="740" y="64.2" class="num">5</text><text x="734" y="86" class="title" style="font-size:14.5px">OVMS server</text><text x="734" y="106" class="sub">decodes tool calls</text><text x="734" y="122" class="sub">Windows, Linux</text></g><g class="card"><rect x="720" y="146" width="140" height="72" rx="12" class="box"/><text x="734" y="172" class="title" style="font-size:14.5px">Local model</text><text x="734" y="192" class="sub">openvino_genai,</text><text x="734" y="208" class="sub">no tools, any OS</text></g><path d="M160 130H193" class="link" marker-end="url(#arrow)"/><path d="M335 130H368" class="link" marker-end="url(#arrow)"/><path d="M510 130H543" class="link" marker-end="url(#arrow)"/><path d="M685 119.5L718 111.8" class="link" marker-end="url(#arrow)"/><path d="M685 142L718 158" class="link" marker-end="url(#arrow)"/><path d="M790 230V258" class="link" marker-end="url(#arrow)"/><rect x="20" y="226" width="140" height="28" rx="14" class="box" style="stroke:var(--ok)"/><text x="90" y="244.5" class="sub" text-anchor="middle" style="fill:var(--oktext);font-weight:600">answer + sources</text><rect x="20" y="262" width="840" height="50" rx="12" class="box2"/><text x="38" y="292" class="title" style="font-size:13.5px">Intel hardware</text><text x="146" y="292" class="sub">model.device picks where the model runs</text><rect x="604" y="273" width="70" height="28" rx="7" class="box"/><text x="639" y="292" class="title" text-anchor="middle" style="font-size:13px">CPU</text><rect x="690" y="273" width="70" height="28" rx="7" class="box"/><text x="725" y="292" class="title" text-anchor="middle" style="font-size:13px">GPU</text><rect x="776" y="273" width="70" height="28" rx="7" class="box"/><text x="811" y="292" class="title" text-anchor="middle" style="font-size:13px">NPU</text></svg>

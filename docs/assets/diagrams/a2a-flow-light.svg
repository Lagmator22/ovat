<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-labelledby="t d"><title id="t">One question to another agent over A2A</title><desc id="d">A caller sends a message. The server checks the host, the body size and the bearer token, then admission limits, then gives each caller and conversation its own agent. A run takes the conversation lock and then the one-model gate, runs only the exposed tools, and the answer comes back as a task update.</desc><style>
svg{--text:#1F2328;--sub:#57606A;--card:#FFFFFF;--card2:#F6F8FA;--border:#D0D7DE;--line:#8C959F;--accent:#0068B5;--soft:rgba(0,104,181,0.08);--purple:#8F5CFF;--ok:#3DD68C;--oktext:#1A7F37;--warn:#FFC107;--warntext:#9A6700;--halo:rgba(0,104,181,0.22);--mono:#0068B5}
text{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;fill:var(--text)}
.title{font-weight:650}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;fill:var(--mono);font-size:12px}
.sub{fill:var(--sub);font-size:12.5px}
.small{fill:var(--sub);font-size:11.5px}
.num{fill:#fff;font-size:11.5px;font-weight:700;text-anchor:middle}
.box{fill:var(--card);stroke:var(--border);stroke-width:1.2}
.tool .box{stroke:var(--purple)}
.ok .box{stroke:var(--ok)}
.warn .box{stroke:var(--warn)}
.link{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-ok{fill:none;stroke:var(--ok);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-purple{fill:none;stroke:var(--purple);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-warn{fill:none;stroke:var(--warn);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.hl{fill:var(--soft);stroke:url(#brand);stroke-width:4}
.arrowhead{fill:var(--line)}
@keyframes flow{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion: reduce){.fx{display:none}*{animation:none!important}}
@keyframes s0{0.00%{opacity:0} 2.00%{opacity:1} 12.29%{opacity:1} 14.29%{opacity:0} 100.00%{opacity:0}}.s0{animation:s0 16.8s linear infinite}
@keyframes s1{0.00%{opacity:0} 14.29%{opacity:0} 16.29%{opacity:1} 26.57%{opacity:1} 28.57%{opacity:0} 100.00%{opacity:0}}.s1{animation:s1 16.8s linear infinite}
@keyframes s2{0.00%{opacity:0} 28.57%{opacity:0} 30.57%{opacity:1} 40.86%{opacity:1} 42.86%{opacity:0} 100.00%{opacity:0}}.s2{animation:s2 16.8s linear infinite}
@keyframes s3{0.00%{opacity:0} 42.86%{opacity:0} 44.86%{opacity:1} 55.14%{opacity:1} 57.14%{opacity:0} 100.00%{opacity:0}}.s3{animation:s3 16.8s linear infinite}
@keyframes s4{0.00%{opacity:0} 57.14%{opacity:0} 59.14%{opacity:1} 69.43%{opacity:1} 71.43%{opacity:0} 100.00%{opacity:0}}.s4{animation:s4 16.8s linear infinite}
@keyframes s5{0.00%{opacity:0} 71.43%{opacity:0} 73.43%{opacity:1} 83.71%{opacity:1} 85.71%{opacity:0} 100.00%{opacity:0}}.s5{animation:s5 16.8s linear infinite}
@keyframes s6{0.00%{opacity:0} 85.71%{opacity:0} 87.71%{opacity:1} 98.00%{opacity:1} 100.00%{opacity:0}}.s6{animation:s6 16.8s linear infinite}
</style><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0068B5"/><stop offset="0.55" stop-color="#00C7FD"/><stop offset="1" stop-color="#8F5CFF"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="18.5" y="58.5" width="183" height="127" rx="13.5" class="hl s0" opacity="0"/><rect x="238.5" y="58.5" width="183" height="127" rx="13.5" class="hl s0" opacity="0"/><rect x="238.5" y="58.5" width="183" height="127" rx="13.5" class="hl s1" opacity="0"/><rect x="458.5" y="58.5" width="183" height="127" rx="13.5" class="hl s1" opacity="0"/><rect x="458.5" y="58.5" width="183" height="127" rx="13.5" class="hl s2" opacity="0"/><rect x="678.5" y="58.5" width="183" height="127" rx="13.5" class="hl s2" opacity="0"/><rect x="678.5" y="58.5" width="183" height="127" rx="13.5" class="hl s3" opacity="0"/><rect x="678.5" y="236.5" width="183" height="109" rx="13.5" class="hl s3" opacity="0"/><rect x="678.5" y="236.5" width="183" height="109" rx="13.5" class="hl s4" opacity="0"/><rect x="458.5" y="236.5" width="183" height="109" rx="13.5" class="hl s4" opacity="0"/><rect x="458.5" y="236.5" width="183" height="109" rx="13.5" class="hl s5" opacity="0"/><rect x="238.5" y="236.5" width="183" height="109" rx="13.5" class="hl s5" opacity="0"/><rect x="238.5" y="236.5" width="183" height="109" rx="13.5" class="hl s6" opacity="0"/><rect x="18.5" y="58.5" width="183" height="127" rx="13.5" class="hl s6" opacity="0"/><text x="20" y="30" class="mono" style="font-size:13px">$ ovat a2a serve workflow.yml --port 9100        (or /serve in the agent TUI)</text><path d="M200 122 L238 122" class="link" marker-end="url(#arrow)"/><path d="M420 122 L458 122" class="link" marker-end="url(#arrow)"/><path d="M640 122 L678 122" class="link" marker-end="url(#arrow)"/><path d="M770 184 L770 236" class="link" marker-end="url(#arrow)"/><path d="M678 291 L642 291" class="link" marker-end="url(#arrow)"/><path d="M458 291 L422 291" class="link-ok" marker-end="url(#arrow)"/><path d="M238 300 C130 300 110 270 110 186" class="link-ok" marker-end="url(#arrow)"/><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="16.8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0114;0.1171;1" keyPoints="0;0;1;1" path="M200 122 L238 122"/><animate attributeName="opacity" dur="16.8s" repeatCount="indefinite" keyTimes="0;0.0114;0.0154;0.1171;0.1211;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="16.8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1543;0.2600;1" keyPoints="0;0;1;1" path="M420 122 L458 122"/><animate attributeName="opacity" dur="16.8s" repeatCount="indefinite" keyTimes="0;0.1543;0.1583;0.2600;0.2640;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="16.8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2971;0.4029;1" keyPoints="0;0;1;1" path="M640 122 L678 122"/><animate attributeName="opacity" dur="16.8s" repeatCount="indefinite" keyTimes="0;0.2971;0.3011;0.4029;0.4069;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="16.8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4400;0.5457;1" keyPoints="0;0;1;1" path="M770 184 L770 236"/><animate attributeName="opacity" dur="16.8s" repeatCount="indefinite" keyTimes="0;0.4400;0.4440;0.5457;0.5497;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--purple)" opacity="0.22"/><circle r="6" fill="var(--purple)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="16.8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5829;0.6886;1" keyPoints="0;0;1;1" path="M678 291 L642 291"/><animate attributeName="opacity" dur="16.8s" repeatCount="indefinite" keyTimes="0;0.5829;0.5869;0.6886;0.6926;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--ok)" opacity="0.22"/><circle r="6" fill="var(--ok)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="16.8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.7257;0.8314;1" keyPoints="0;0;1;1" path="M458 291 L422 291"/><animate attributeName="opacity" dur="16.8s" repeatCount="indefinite" keyTimes="0;0.7257;0.7297;0.8314;0.8354;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--ok)" opacity="0.22"/><circle r="6" fill="var(--ok)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="16.8s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8686;0.9743;1" keyPoints="0;0;1;1" path="M238 300 C130 300 110 270 110 186"/><animate attributeName="opacity" dur="16.8s" repeatCount="indefinite" keyTimes="0;0.8686;0.8726;0.9743;0.9783;1" values="0;0;1;1;0;0"/></g><g class="card"><rect x="20" y="60" width="180" height="124" rx="12" class="box"/><circle cx="40" cy="60" r="10.5" fill="url(#brand)"/><text x="40" y="64.2" class="num">1</text><text x="34" y="88" class="title" style="font-size:14.5px">Caller</text><text x="34" y="110" class="sub">a subagent of kind a2a</text><text x="34" y="127" class="sub">token sent per request</text><text x="34" y="144" class="sub">to its own host only</text></g><g class="card"><rect x="240" y="60" width="180" height="124" rx="12" class="box"/><circle cx="260" cy="60" r="10.5" fill="url(#brand)"/><text x="260" y="64.2" class="num">2</text><text x="254" y="88" class="title" style="font-size:14.5px">HTTP guard</text><text x="254" y="110" class="sub">host check, then a</text><text x="254" y="127" class="sub">size cap, then the</text><text x="254" y="144" class="sub">bearer token</text></g><g class="card"><rect x="460" y="60" width="180" height="124" rx="12" class="box"/><circle cx="480" cy="60" r="10.5" fill="url(#brand)"/><text x="480" y="64.2" class="num">3</text><text x="474" y="88" class="title" style="font-size:14.5px">Admission</text><text x="474" y="110" class="sub">loop and hop limits,</text><text x="474" y="127" class="sub">empty or too long,</text><text x="474" y="144" class="sub">queue full, rate limit</text></g><g class="card"><rect x="680" y="60" width="180" height="124" rx="12" class="box"/><circle cx="700" cy="60" r="10.5" fill="url(#brand)"/><text x="700" y="64.2" class="num">4</text><text x="694" y="88" class="title" style="font-size:14.5px">Conversation</text><text x="694" y="110" class="sub">one agent per caller</text><text x="694" y="127" class="sub">and conversation id,</text><text x="694" y="144" class="sub">built with the exposed</text><text x="694" y="161" class="sub">tools only</text></g><g class="card"><rect x="680" y="238" width="180" height="106" rx="12" class="box"/><circle cx="700" cy="238" r="10.5" fill="url(#brand)"/><text x="700" y="242.2" class="num">5</text><text x="694" y="266" class="title" style="font-size:14.5px">Slot, then gate</text><text x="694" y="288" class="sub">one run per chat,</text><text x="694" y="305" class="sub">then the one-model</text><text x="694" y="322" class="sub">gate (a lock)</text></g><g class="card tool"><rect x="460" y="238" width="180" height="106" rx="12" class="box"/><circle cx="480" cy="238" r="10.5" fill="url(#brand)"/><text x="480" y="242.2" class="num">6</text><text x="474" y="266" class="title" style="font-size:14.5px">Agent runs</text><text x="474" y="288" class="sub">the engine and tools</text><text x="474" y="305" class="sub">as in the TUI; a person</text><text x="474" y="322" class="sub">can approve a tool</text></g><g class="card ok"><rect x="240" y="238" width="180" height="106" rx="12" class="box"/><circle cx="260" cy="238" r="10.5" fill="url(#brand)"/><text x="260" y="242.2" class="num">7</text><text x="254" y="266" class="title" style="font-size:14.5px">Reply</text><text x="254" y="288" class="sub">answer, sources and</text><text x="254" y="305" class="sub">token counts, as an</text><text x="254" y="322" class="sub">A2A task update</text></g><text x="20" y="376" class="small">The A2A SDK is imported in one place only (ovat/a2a/sdk/); a test keeps it that way.</text></svg>
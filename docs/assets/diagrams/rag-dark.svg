<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-labelledby="t d"><title id="t">RAG: index your documents, then search and cite</title><desc id="d">Indexing runs once: your .md and .txt files are cut into chunks, each chunk is turned into 384 numbers by bge-small, and stored in one sqlite-vec file. For every question, the question is turned into numbers the same way, the closest chunks are found, and the model answers from them and lists the source files.</desc><style>
svg{--text:#E6EDF3;--sub:#9AA7B4;--card:#161B22;--card2:#0F141A;--border:#30363D;--line:#6E7681;--accent:#00C7FD;--soft:rgba(0,199,253,0.08);--purple:#A98BFF;--ok:#3DD68C;--oktext:#3DD68C;--warn:#FFC107;--warntext:#FFC107;--halo:rgba(0,199,253,0.25);--mono:#00C7FD}
text{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;fill:var(--text)}
.title{font-weight:650}
.mono-title,.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
.mono{fill:var(--mono);font-size:13px}
.sub{fill:var(--sub);font-size:12.5px}
.small{fill:var(--sub);font-size:11.5px}
.cap{font-size:13px;font-weight:600;fill:var(--text)}
.num{fill:#fff;font-size:11.5px;font-weight:700;text-anchor:middle}
.box{fill:var(--card);stroke:var(--border);stroke-width:1.2}
.box2{fill:var(--card2);stroke:var(--border);stroke-width:1.2}
.group{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}
.link{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-ok{fill:none;stroke:var(--ok);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-purple{fill:none;stroke:var(--purple);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.solid{fill:none;stroke:var(--line);stroke-width:1.6}
.hl{fill:var(--soft);stroke:url(#brand);stroke-width:4}
.page{fill:var(--card);stroke:var(--accent);stroke-width:1.5}
.pagelines{stroke:var(--accent);stroke-width:1.2;fill:none}
.arrowhead{fill:var(--line)}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes t0{0.00%{opacity:0} 0.00%{opacity:1} 7.50%{opacity:1} 9.58%{opacity:0} 100.00%{opacity:0}}.t0{animation:t0 12s linear infinite}@keyframes t1{0.00%{opacity:0} 6.25%{opacity:0} 8.33%{opacity:1} 15.83%{opacity:1} 17.92%{opacity:0} 100.00%{opacity:0}}.t1{animation:t1 12s linear infinite}@keyframes t2{0.00%{opacity:0} 17.92%{opacity:0} 20.00%{opacity:1} 27.50%{opacity:1} 29.58%{opacity:0} 100.00%{opacity:0}}.t2{animation:t2 12s linear infinite}@keyframes t3{0.00%{opacity:0} 29.58%{opacity:0} 31.67%{opacity:1} 40.00%{opacity:1} 42.08%{opacity:0} 100.00%{opacity:0}}.t3{animation:t3 12s linear infinite}@keyframes l0{0.00%{opacity:0} 42.92%{opacity:0} 45.00%{opacity:1} 52.50%{opacity:1} 54.58%{opacity:0} 100.00%{opacity:0}}.l0{animation:l0 12s linear infinite}@keyframes l1{0.00%{opacity:0} 51.25%{opacity:0} 53.33%{opacity:1} 60.83%{opacity:1} 62.92%{opacity:0} 100.00%{opacity:0}}.l1{animation:l1 12s linear infinite}@keyframes l2{0.00%{opacity:0} 62.92%{opacity:0} 65.00%{opacity:1} 80.00%{opacity:1} 82.08%{opacity:0} 100.00%{opacity:0}}.l2{animation:l2 12s linear infinite}@keyframes l3{0.00%{opacity:0} 82.08%{opacity:0} 84.17%{opacity:1} 95.00%{opacity:1} 97.08%{opacity:0} 100.00%{opacity:0}}.l3{animation:l3 12s linear infinite}@keyframes src{0.00%{opacity:0} 84.58%{opacity:0} 86.67%{opacity:1} 96.67%{opacity:1} 98.75%{opacity:0} 100.00%{opacity:0}}.src{animation:src 12s linear infinite}
@media (prefers-reduced-motion: reduce){.fx{display:none}*{animation:none!important}}
</style><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0068B5"/><stop offset="0.55" stop-color="#00C7FD"/><stop offset="1" stop-color="#8F5CFF"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="678.5" y="290.5" width="183" height="29" rx="15" class="hl src" opacity="0"/><rect x="678.5" y="198.5" width="183" height="83" rx="13.5" class="hl l3" opacity="0"/><rect x="458.5" y="198.5" width="183" height="83" rx="13.5" class="hl l2" opacity="0"/><rect x="238.5" y="198.5" width="183" height="83" rx="13.5" class="hl l1" opacity="0"/><rect x="18.5" y="198.5" width="183" height="83" rx="13.5" class="hl l0" opacity="0"/><rect x="678.5" y="48.5" width="183" height="83" rx="13.5" class="hl t3" opacity="0"/><rect x="458.5" y="48.5" width="183" height="83" rx="13.5" class="hl t2" opacity="0"/><rect x="238.5" y="48.5" width="183" height="83" rx="13.5" class="hl t1" opacity="0"/><rect x="18.5" y="48.5" width="183" height="83" rx="13.5" class="hl t0" opacity="0"/><circle cx="30" cy="27" r="10.5" fill="url(#brand)"/><text x="30" y="31.2" class="num">1</text><text x="48" y="32" class="cap">Index once</text><text x="140" y="32" class="mono">ovat index ./docs workflow.yml</text><circle cx="30" cy="177" r="10.5" fill="url(#brand)"/><text x="30" y="181.2" class="num">2</text><text x="48" y="182" class="cap">Every question</text><text x="166" y="182" class="mono">ovat run   or   ovat chat</text><path d="M200 90H236" class="link" marker-end="url(#arrow)"/><path d="M200 240H236" class="link" marker-end="url(#arrow)"/><path d="M420 90H456" class="link" marker-end="url(#arrow)"/><path d="M420 240H456" class="link" marker-end="url(#arrow)"/><path d="M640 90H676" class="link" marker-end="url(#arrow)"/><path d="M640 240H676" class="link" marker-end="url(#arrow)"/><path d="M770 130C770 170 640 160 604 196" class="link-ok" marker-end="url(#arrow)"/><text x="744" y="172" class="small">nearest chunks</text><g class="fx" opacity="0"><rect x="-7" y="-9" width="14" height="18" rx="2" class="page"/><path d="M-3.5 -3H3.5M-3.5 1H3.5M-3.5 5H1.5" class="pagelines"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0167;0.1000;0.1333;0.2167;0.2500;0.3333;0.3833;1.0000" keyPoints="0.0000;0.0000;0.3333;0.3333;0.6667;0.6667;1.0000;1.0000;1.0000" path="M110 90 L770 90"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.0166;0.0333;0.3667;0.3834;1.0000" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.4667;0.5500;0.5833;0.6667;0.7833;0.8667;0.9000;1.0000" keyPoints="0.0000;0.0000;0.3333;0.3333;0.6667;0.6667;1.0000;1.0000;1.0000" path="M110 240 L770 240"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.4666;0.4833;0.8833;0.9001;1.0000" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="10.5" fill="var(--ok)" opacity="0.22"/><circle r="4.5" fill="var(--ok)"/><circle r="1.8" fill="#fff" opacity="0.9"/><animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.6667;0.7417;0.7583;1.0000" keyPoints="0.0000;0.0000;1.0000;1.0000;1.0000" path="M770 130 C770 170 640 160 600 200"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0.0000;0.6666;0.6833;0.7417;0.7584;1.0000" values="0;0;1;1;0;0"/></g><g class="card"><rect x="20" y="50" width="180" height="80" rx="12" class="box"/><text x="34" y="76" class="title" style="font-size:14.5px">Your files</text><text x="34" y="96" class="sub">.md and .txt,</text><text x="34" y="112" class="sub">any folder</text></g><g class="card"><rect x="240" y="50" width="180" height="80" rx="12" class="box"/><text x="254" y="76" class="title" style="font-size:14.5px">Chunk</text><text x="254" y="96" class="sub">512 characters each,</text><text x="254" y="112" class="sub">64 shared with the next</text></g><g class="card"><rect x="460" y="50" width="180" height="80" rx="12" class="box"/><text x="474" y="76" class="title" style="font-size:14.5px">Embed</text><text x="474" y="96" class="sub">bge-small turns each</text><text x="474" y="112" class="sub">chunk into 384 numbers</text></g><g class="card"><rect x="680" y="50" width="180" height="80" rx="12" class="box"/><text x="694" y="76" class="title" style="font-size:14.5px">Store</text><text x="694" y="96" class="sub">one sqlite-vec file,</text><text x="694" y="112" class="sub">plus each file's date</text></g><g class="card"><rect x="20" y="200" width="180" height="80" rx="12" class="box"/><text x="34" y="226" class="title" style="font-size:14.5px">Question</text><text x="34" y="246" class="sub">in plain words</text></g><g class="card"><rect x="240" y="200" width="180" height="80" rx="12" class="box"/><text x="254" y="226" class="title" style="font-size:14.5px">Embed</text><text x="254" y="246" class="sub">the same model,</text><text x="254" y="262" class="sub">the same 384 numbers</text></g><g class="card"><rect x="460" y="200" width="180" height="80" rx="12" class="box"/><text x="474" y="226" class="title" style="font-size:14.5px">Search</text><text x="474" y="246" class="sub">finds the chunks</text><text x="474" y="262" class="sub">closest in meaning</text></g><g class="card"><rect x="680" y="200" width="180" height="80" rx="12" class="box"/><text x="694" y="226" class="title" style="font-size:14.5px">Answer</text><text x="694" y="246" class="sub">written from those</text><text x="694" y="262" class="sub">chunks, with sources</text></g><rect x="680" y="292" width="180" height="26" rx="13" class="box" style="stroke:var(--ok)"/><text x="770" y="309.5" class="mono" text-anchor="middle" style="fill:var(--oktext);font-size:11.5px">sources: docs/notes.md</text><circle cx="29" cy="349" r="8" style="fill:var(--warn)"/><text x="29" y="353" text-anchor="middle" style="fill:#1F2328;font-size:11px;font-weight:800">!</text><text x="44" y="353" class="small">Edited a file after indexing? ovat run and ovat chat name the files that changed, so you know to run ovat index again.</text><text x="20" y="378" class="small">ovat chat does this with no server and no tool calls. With OVMS, the agent decides to call search_docs itself.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-labelledby="tplano dplano">
<title id="tplano">The plano request path</title><desc id="dplano">ovat run points ovms_url at :8000/v1, where plano (Envoy) listens and records OpenTelemetry spans. Requests pass through ovms_id_bridge.py on :8001 to OVMS on :8002/v3, the port in model.ovms_port. planoai obs shows latency, time to first token and tokens.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d"><title id="t">A tool call, and who may say yes</title><desc id="d">The model asks for a tool. One wrapper, events.observed, checks the permission of that tool or subagent. Allow runs it. Ask opens an approval panel with once, session, always and deny when someone is there to answer, and counts as no when nobody is. Deny sends the model a plain sentence.</desc><style>
svg{--text:#1F2328;--sub:#57606A;--card:#FFFFFF;--card2:#F6F8FA;--border:#D0D7DE;--line:#8C959F;--accent:#0068B5;--soft:rgba(0,104,181,0.08);--purple:#8F5CFF;--ok:#3DD68C;--oktext:#1A7F37;--warn:#FFC107;--warntext:#9A6700;--halo:rgba(0,104,181,0.22);--mono:#0068B5}
text{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;fill:var(--text)}
.title{font-weight:650}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;fill:var(--mono);font-size:12px}
.sub{fill:var(--sub);font-size:12.5px}
.small{fill:var(--sub);font-size:11.5px}
.num{fill:#fff;font-size:11.5px;font-weight:700;text-anchor:middle}
.box{fill:var(--card);stroke:var(--border);stroke-width:1.2}
.tool .box{stroke:var(--purple)}
.ok .box{stroke:var(--ok)}
.warn .box{stroke:var(--warn)}
.link{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-ok{fill:none;stroke:var(--ok);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-purple{fill:none;stroke:var(--purple);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-warn{fill:none;stroke:var(--warn);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.hl{fill:var(--soft);stroke:url(#brand);stroke-width:4}
.arrowhead{fill:var(--line)}
@keyframes flow{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion: reduce){.fx{display:none}*{animation:none!important}}
@keyframes s0{0.00%{opacity:0} 2.00%{opacity:1} 14.67%{opacity:1} 16.67%{opacity:0} 100.00%{opacity:0}}.s0{animation:s0 14.4s linear infinite}
@keyframes s1{0.00%{opacity:0} 16.67%{opacity:0} 18.67%{opacity:1} 31.33%{opacity:1} 33.33%{opacity:0} 100.00%{opacity:0}}.s1{animation:s1 14.4s linear infinite}
@keyframes s2{0.00%{opacity:0} 33.33%{opacity:0} 35.33%{opacity:1} 48.00%{opacity:1} 50.00%{opacity:0} 100.00%{opacity:0}}.s2{animation:s2 14.4s linear infinite}
@keyframes s3{0.00%{opacity:0} 50.00%{opacity:0} 52.00%{opacity:1} 64.67%{opacity:1} 66.67%{opacity:0} 100.00%{opacity:0}}.s3{animation:s3 14.4s linear infinite}
@keyframes s4{0.00%{opacity:0} 66.67%{opacity:0} 68.67%{opacity:1} 81.33%{opacity:1} 83.33%{opacity:0} 100.00%{opacity:0}}.s4{animation:s4 14.4s linear infinite}
@keyframes s5{0.00%{opacity:0} 83.33%{opacity:0} 85.33%{opacity:1} 98.00%{opacity:1} 100.00%{opacity:0}}.s5{animation:s5 14.4s linear infinite}
</style><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0068B5"/><stop offset="0.55" stop-color="#00C7FD"/><stop offset="1" stop-color="#8F5CFF"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="18.5" y="183.5" width="173" height="103" rx="13.5" class="hl s0" opacity="0"/><rect x="228.5" y="183.5" width="193" height="103" rx="13.5" class="hl s0" opacity="0"/><rect x="228.5" y="183.5" width="193" height="103" rx="13.5" class="hl s1" opacity="0"/><rect x="458.5" y="183.5" width="173" height="103" rx="13.5" class="hl s1" opacity="0"/><rect x="458.5" y="183.5" width="173" height="103" rx="13.5" class="hl s2" opacity="0"/><rect x="688.5" y="18.5" width="173" height="93" rx="13.5" class="hl s2" opacity="0"/><rect x="458.5" y="183.5" width="173" height="103" rx="13.5" class="hl s3" opacity="0"/><rect x="688.5" y="128.5" width="173" height="113" rx="13.5" class="hl s3" opacity="0"/><rect x="458.5" y="183.5" width="173" height="103" rx="13.5" class="hl s4" opacity="0"/><rect x="688.5" y="258.5" width="173" height="93" rx="13.5" class="hl s4" opacity="0"/><rect x="458.5" y="183.5" width="173" height="103" rx="13.5" class="hl s5" opacity="0"/><rect x="688.5" y="368.5" width="173" height="83" rx="13.5" class="hl s5" opacity="0"/><text x="20" y="30" class="mono" style="font-size:13px">write_file, edit, shell, web_fetch and web_search ask first</text><path d="M190 235 L228 235" class="link" marker-end="url(#arrow)"/><path d="M420 235 L458 235" class="link" marker-end="url(#arrow)"/><path d="M630 215 C660 215 660 65 688 65" class="link-ok" marker-end="url(#arrow)"/><path d="M630 235 L688 190" class="link-purple" marker-end="url(#arrow)"/><path d="M630 255 C660 255 660 305 688 305" class="link-warn" marker-end="url(#arrow)"/><path d="M630 270 C650 270 650 410 688 410" class="link-warn" marker-end="url(#arrow)"/><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0133;0.1367;1" keyPoints="0;0;1;1" path="M190 235 L228 235"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.0133;0.0173;0.1367;0.1407;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1800;0.3033;1" keyPoints="0;0;1;1" path="M420 235 L458 235"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.1800;0.1840;0.3033;0.3073;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--ok)" opacity="0.22"/><circle r="6" fill="var(--ok)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3467;0.4700;1" keyPoints="0;0;1;1" path="M630 215 C660 215 660 65 688 65"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.3467;0.3507;0.4700;0.4740;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--purple)" opacity="0.22"/><circle r="6" fill="var(--purple)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5133;0.6367;1" keyPoints="0;0;1;1" path="M630 235 L688 190"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.5133;0.5173;0.6367;0.6407;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--warn)" opacity="0.22"/><circle r="6" fill="var(--warn)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6800;0.8033;1" keyPoints="0;0;1;1" path="M630 255 C660 255 660 305 688 305"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.6800;0.6840;0.8033;0.8073;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--warn)" opacity="0.22"/><circle r="6" fill="var(--warn)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.8467;0.9700;1" keyPoints="0;0;1;1" path="M630 270 C650 270 650 410 688 410"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.8467;0.8507;0.9700;0.9740;1" values="0;0;1;1;0;0"/></g><g class="card"><rect x="20" y="185" width="170" height="100" rx="12" class="box"/><circle cx="40" cy="185" r="10.5" fill="url(#brand)"/><text x="40" y="189.2" class="num">1</text><text x="34" y="213" class="title" style="font-size:14.5px">Tool call</text><text x="34" y="235" class="sub">the model asks for</text><text x="34" y="252" class="sub">write_file, shell, or</text><text x="34" y="269" class="sub">a subagent</text></g><g class="card"><rect x="230" y="185" width="190" height="100" rx="12" class="box"/><circle cx="250" cy="185" r="10.5" fill="url(#brand)"/><text x="250" y="189.2" class="num">2</text><text x="244" y="213" class="title" style="font-size:14.5px">Wrapper</text><text x="244" y="235" class="mono">events.observed()</text><text x="244" y="252" class="sub">one wrapper for all</text><text x="244" y="269" class="sub">four engines</text></g><g class="card"><rect x="460" y="185" width="170" height="100" rx="12" class="box"/><circle cx="480" cy="185" r="10.5" fill="url(#brand)"/><text x="480" y="189.2" class="num">3</text><text x="474" y="213" class="title" style="font-size:14.5px">Permission</text><text x="474" y="235" class="sub">allow, ask or deny</text><text x="474" y="252" class="sub">per tool and subagent</text></g><g class="card ok"><rect x="690" y="20" width="170" height="90" rx="12" class="box"/><circle cx="710" cy="20" r="10.5" fill="url(#brand)"/><text x="710" y="24.2" class="num">4</text><text x="704" y="48" class="title" style="font-size:14.5px">allow: runs</text><text x="704" y="70" class="sub">the result goes to</text><text x="704" y="87" class="sub">the model</text></g><g class="card tool"><rect x="690" y="130" width="170" height="110" rx="12" class="box"/><circle cx="710" cy="130" r="10.5" fill="url(#brand)"/><text x="710" y="134.2" class="num">5</text><text x="704" y="158" class="title" style="font-size:14.5px">ask: a person</text><text x="704" y="180" class="sub">once, session,</text><text x="704" y="197" class="sub">always, or deny.</text><text x="704" y="214" class="sub">The worker waits.</text></g><g class="card warn"><rect x="690" y="260" width="170" height="90" rx="12" class="box"/><circle cx="710" cy="260" r="10.5" fill="url(#brand)"/><text x="710" y="264.2" class="num">6</text><text x="704" y="288" class="title" style="font-size:14.5px">ask, no approver</text><text x="704" y="310" class="sub">ovat run, bench, A2A:</text><text x="704" y="327" class="sub">counts as no</text></g><g class="card warn"><rect x="690" y="370" width="170" height="80" rx="12" class="box"/><circle cx="710" cy="370" r="10.5" fill="url(#brand)"/><text x="710" y="374.2" class="num">7</text><text x="704" y="398" class="title" style="font-size:14.5px">deny: refused</text><text x="704" y="420" class="sub">a sentence goes back</text><text x="704" y="437" class="sub">to the model</text></g><text x="20" y="456" class="small">Reading and searching run on their own. Writing, editing, shell and web tools ask first.</text></svg>
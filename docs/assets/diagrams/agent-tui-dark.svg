<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-labelledby="t d"><title id="t">The agent TUI, from keystroke to card</title><desc id="d">You type in the terminal client. It sends a JSON-RPC request to OVAT's app server, which starts a turn on AgentSession. AgentSession runs the chosen engine on a worker thread; the engine asks the model on OVMS, and every tool call goes through one wrapper that reports events. The events travel back up the same layers and the client draws them.</desc><style>
svg{--text:#E6EDF3;--sub:#9AA7B4;--card:#161B22;--card2:#0F141A;--border:#30363D;--line:#6E7681;--accent:#00C7FD;--soft:rgba(0,199,253,0.08);--purple:#A98BFF;--ok:#3DD68C;--oktext:#3DD68C;--warn:#FFC107;--warntext:#FFC107;--halo:rgba(0,199,253,0.25);--mono:#00C7FD}
text{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;fill:var(--text)}
.title{font-weight:650}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;fill:var(--mono);font-size:12px}
.sub{fill:var(--sub);font-size:12.5px}
.small{fill:var(--sub);font-size:11.5px}
.num{fill:#fff;font-size:11.5px;font-weight:700;text-anchor:middle}
.box{fill:var(--card);stroke:var(--border);stroke-width:1.2}
.tool .box{stroke:var(--purple)}
.ok .box{stroke:var(--ok)}
.warn .box{stroke:var(--warn)}
.link{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-ok{fill:none;stroke:var(--ok);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-purple{fill:none;stroke:var(--purple);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-warn{fill:none;stroke:var(--warn);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.hl{fill:var(--soft);stroke:url(#brand);stroke-width:4}
.arrowhead{fill:var(--line)}
@keyframes flow{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion: reduce){.fx{display:none}*{animation:none!important}}
@keyframes s0{0.00%{opacity:0} 2.00%{opacity:1} 14.67%{opacity:1} 16.67%{opacity:0} 100.00%{opacity:0}}.s0{animation:s0 14.4s linear infinite}
@keyframes s1{0.00%{opacity:0} 16.67%{opacity:0} 18.67%{opacity:1} 31.33%{opacity:1} 33.33%{opacity:0} 100.00%{opacity:0}}.s1{animation:s1 14.4s linear infinite}
@keyframes s2{0.00%{opacity:0} 33.33%{opacity:0} 35.33%{opacity:1} 48.00%{opacity:1} 50.00%{opacity:0} 100.00%{opacity:0}}.s2{animation:s2 14.4s linear infinite}
@keyframes s3{0.00%{opacity:0} 50.00%{opacity:0} 52.00%{opacity:1} 64.67%{opacity:1} 66.67%{opacity:0} 100.00%{opacity:0}}.s3{animation:s3 14.4s linear infinite}
@keyframes s4{0.00%{opacity:0} 66.67%{opacity:0} 68.67%{opacity:1} 81.33%{opacity:1} 83.33%{opacity:0} 100.00%{opacity:0}}.s4{animation:s4 14.4s linear infinite}
@keyframes s5{0.00%{opacity:0} 83.33%{opacity:0} 85.33%{opacity:1} 98.00%{opacity:1} 100.00%{opacity:0}}.s5{animation:s5 14.4s linear infinite}
</style><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0068B5"/><stop offset="0.55" stop-color="#00C7FD"/><stop offset="1" stop-color="#8F5CFF"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="18.5" y="60.5" width="183" height="115" rx="13.5" class="hl s0" opacity="0"/><rect x="238.5" y="60.5" width="183" height="115" rx="13.5" class="hl s0" opacity="0"/><rect x="238.5" y="60.5" width="183" height="115" rx="13.5" class="hl s1" opacity="0"/><rect x="458.5" y="60.5" width="183" height="115" rx="13.5" class="hl s1" opacity="0"/><rect x="458.5" y="60.5" width="183" height="115" rx="13.5" class="hl s2" opacity="0"/><rect x="678.5" y="60.5" width="183" height="115" rx="13.5" class="hl s2" opacity="0"/><rect x="678.5" y="60.5" width="183" height="115" rx="13.5" class="hl s3" opacity="0"/><rect x="678.5" y="236.5" width="183" height="85" rx="13.5" class="hl s3" opacity="0"/><rect x="678.5" y="60.5" width="183" height="115" rx="13.5" class="hl s4" opacity="0"/><rect x="458.5" y="60.5" width="183" height="115" rx="13.5" class="hl s4" opacity="0"/><rect x="238.5" y="60.5" width="183" height="115" rx="13.5" class="hl s4" opacity="0"/><rect x="18.5" y="60.5" width="183" height="115" rx="13.5" class="hl s5" opacity="0"/><text x="20" y="30" class="mono" style="font-size:13px">$ ovat agent workflow.yml</text><path d="M200 118 L238 118" class="link" marker-end="url(#arrow)"/><path d="M420 118 L458 118" class="link" marker-end="url(#arrow)"/><path d="M640 118 L678 118" class="link" marker-end="url(#arrow)"/><path d="M770 174 L770 236" class="link" marker-end="url(#arrow)"/><path d="M740 176 C740 216 110 216 110 178" class="link-ok" marker-end="url(#arrow)"/><text x="400" y="236" class="small" text-anchor="middle">events go back up the same way</text><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0133;0.1367;1" keyPoints="0;0;1;1" path="M200 118 L238 118"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.0133;0.0173;0.1367;0.1407;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1800;0.3033;1" keyPoints="0;0;1;1" path="M420 118 L458 118"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.1800;0.1840;0.3033;0.3073;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3467;0.4700;1" keyPoints="0;0;1;1" path="M640 118 L678 118"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.3467;0.3507;0.4700;0.4740;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--purple)" opacity="0.22"/><circle r="6" fill="var(--purple)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.5133;0.6367;1" keyPoints="0;0;1;1" path="M770 174 L770 236"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.5133;0.5173;0.6367;0.6407;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--ok)" opacity="0.22"/><circle r="6" fill="var(--ok)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6800;0.8033;1" keyPoints="0;0;1;1" path="M740 176 C740 216 110 216 110 178"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.6800;0.6840;0.8033;0.8073;1" values="0;0;1;1;0;0"/></g><g class="card"><rect x="20" y="62" width="180" height="112" rx="12" class="box"/><circle cx="40" cy="62" r="10.5" fill="url(#brand)"/><text x="40" y="66.2" class="num">1</text><text x="34" y="90" class="title" style="font-size:14.5px">Terminal client</text><text x="34" y="112" class="mono">ovat/tui/vibe/</text><text x="34" y="129" class="sub">keys, widgets, cards</text><text x="34" y="146" class="sub">copied, see NOTICE</text></g><g class="card"><rect x="240" y="62" width="180" height="112" rx="12" class="box"/><circle cx="260" cy="62" r="10.5" fill="url(#brand)"/><text x="260" y="66.2" class="num">2</text><text x="254" y="90" class="title" style="font-size:14.5px">App server</text><text x="254" y="112" class="mono">ovat/tui/server/</text><text x="254" y="129" class="sub">JSON-RPC requests,</text><text x="254" y="146" class="sub">turns, approvals</text></g><g class="card"><rect x="460" y="62" width="180" height="112" rx="12" class="box"/><circle cx="480" cy="62" r="10.5" fill="url(#brand)"/><text x="480" y="66.2" class="num">3</text><text x="474" y="90" class="title" style="font-size:14.5px">AgentSession</text><text x="474" y="112" class="mono">ovat/agentic/</text><text x="474" y="129" class="sub">a worker thread per</text><text x="474" y="146" class="sub">turn, one event callback</text></g><g class="card"><rect x="680" y="62" width="180" height="112" rx="12" class="box"/><circle cx="700" cy="62" r="10.5" fill="url(#brand)"/><text x="700" y="66.2" class="num">4</text><text x="694" y="90" class="title" style="font-size:14.5px">Engine and tools</text><text x="694" y="112" class="sub">four engines, one</text><text x="694" y="129" class="sub">wrapper around every</text><text x="694" y="146" class="sub">tool call</text></g><g class="card"><rect x="680" y="238" width="180" height="82" rx="12" class="box"/><circle cx="700" cy="238" r="10.5" fill="url(#brand)"/><text x="700" y="242.2" class="num">5</text><text x="694" y="266" class="title" style="font-size:14.5px">Model</text><text x="694" y="288" class="sub">OVMS (GPU, NPU, CPU)</text><text x="694" y="305" class="sub">or in-process on CPU</text></g><text x="20" y="358" class="small">ovat/agentic/ imports no UI toolkit (a test scans it), so every layer below the client is tested without a screen.</text></svg>
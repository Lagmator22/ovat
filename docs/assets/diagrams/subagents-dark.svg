<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" role="img" aria-labelledby="t d"><title id="t">Subagents: one tool, three kinds</title><desc id="d">The main agent gets one tool, delegate(agent, task). A subagent is another OVAT workflow in this process, a model behind an OpenAI-compatible API, or an agent reached over A2A. Answers come back framed as information. Progress is reported as events and shown in the /agents table.</desc><style>
svg{--text:#E6EDF3;--sub:#9AA7B4;--card:#161B22;--card2:#0F141A;--border:#30363D;--line:#6E7681;--accent:#00C7FD;--soft:rgba(0,199,253,0.08);--purple:#A98BFF;--ok:#3DD68C;--oktext:#3DD68C;--warn:#FFC107;--warntext:#FFC107;--halo:rgba(0,199,253,0.25);--mono:#00C7FD}
text{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;fill:var(--text)}
.title{font-weight:650}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;fill:var(--mono);font-size:12px}
.sub{fill:var(--sub);font-size:12.5px}
.small{fill:var(--sub);font-size:11.5px}
.num{fill:#fff;font-size:11.5px;font-weight:700;text-anchor:middle}
.box{fill:var(--card);stroke:var(--border);stroke-width:1.2}
.tool .box{stroke:var(--purple)}
.ok .box{stroke:var(--ok)}
.warn .box{stroke:var(--warn)}
.link{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-ok{fill:none;stroke:var(--ok);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-purple{fill:none;stroke:var(--purple);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-warn{fill:none;stroke:var(--warn);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.hl{fill:var(--soft);stroke:url(#brand);stroke-width:4}
.arrowhead{fill:var(--line)}
@keyframes flow{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion: reduce){.fx{display:none}*{animation:none!important}}
@keyframes s0{0.00%{opacity:0} 2.00%{opacity:1} 14.67%{opacity:1} 16.67%{opacity:0} 100.00%{opacity:0}}.s0{animation:s0 14.4s linear infinite}
@keyframes s1{0.00%{opacity:0} 16.67%{opacity:0} 18.67%{opacity:1} 31.33%{opacity:1} 33.33%{opacity:0} 100.00%{opacity:0}}.s1{animation:s1 14.4s linear infinite}
@keyframes s2{0.00%{opacity:0} 33.33%{opacity:0} 35.33%{opacity:1} 48.00%{opacity:1} 50.00%{opacity:0} 100.00%{opacity:0}}.s2{animation:s2 14.4s linear infinite}
@keyframes s3{0.00%{opacity:0} 50.00%{opacity:0} 52.00%{opacity:1} 64.67%{opacity:1} 66.67%{opacity:0} 100.00%{opacity:0}}.s3{animation:s3 14.4s linear infinite}
@keyframes s4{0.00%{opacity:0} 66.67%{opacity:0} 68.67%{opacity:1} 81.33%{opacity:1} 83.33%{opacity:0} 100.00%{opacity:0}}.s4{animation:s4 14.4s linear infinite}
@keyframes s5{0.00%{opacity:0} 83.33%{opacity:0} 85.33%{opacity:1} 98.00%{opacity:1} 100.00%{opacity:0}}.s5{animation:s5 14.4s linear infinite}
</style><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0068B5"/><stop offset="0.55" stop-color="#00C7FD"/><stop offset="1" stop-color="#8F5CFF"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><rect x="18.5" y="118.5" width="193" height="153" rx="13.5" class="hl s0" opacity="0"/><rect x="418.5" y="58.5" width="443" height="95" rx="13.5" class="hl s0" opacity="0"/><rect x="18.5" y="118.5" width="193" height="153" rx="13.5" class="hl s1" opacity="0"/><rect x="418.5" y="174.5" width="443" height="95" rx="13.5" class="hl s1" opacity="0"/><rect x="18.5" y="118.5" width="193" height="153" rx="13.5" class="hl s2" opacity="0"/><rect x="418.5" y="290.5" width="443" height="95" rx="13.5" class="hl s2" opacity="0"/><rect x="18.5" y="118.5" width="193" height="153" rx="13.5" class="hl s3" opacity="0"/><rect x="18.5" y="118.5" width="193" height="153" rx="13.5" class="hl s4" opacity="0"/><rect x="18.5" y="314.5" width="193" height="83" rx="13.5" class="hl s4" opacity="0"/><rect x="18.5" y="118.5" width="193" height="153" rx="13.5" class="hl s5" opacity="0"/><text x="20" y="30" class="mono" style="font-size:13px">subagents: [researcher, team_docs, local_api] in workflow.yml</text><path d="M210 170 L418 106" class="link" marker-end="url(#arrow)"/><path d="M210 195 L418 222" class="link-purple" marker-end="url(#arrow)"/><path d="M210 220 L418 338" class="link" marker-end="url(#arrow)"/><path d="M115 270 L115 314" class="link-ok" marker-end="url(#arrow)"/><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0133;0.1367;1" keyPoints="0;0;1;1" path="M210 170 L418 106"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.0133;0.0173;0.1367;0.1407;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--purple)" opacity="0.22"/><circle r="6" fill="var(--purple)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1800;0.3033;1" keyPoints="0;0;1;1" path="M210 195 L418 222"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.1800;0.1840;0.3033;0.3073;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--accent)" opacity="0.22"/><circle r="6" fill="var(--accent)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3467;0.4700;1" keyPoints="0;0;1;1" path="M210 220 L418 338"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.3467;0.3507;0.4700;0.4740;1" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="12" fill="var(--ok)" opacity="0.22"/><circle r="6" fill="var(--ok)"/><circle r="2.4" fill="#fff" opacity="0.9"/><animateMotion dur="14.4s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.6800;0.8033;1" keyPoints="0;0;1;1" path="M115 270 L115 314"/><animate attributeName="opacity" dur="14.4s" repeatCount="indefinite" keyTimes="0;0.6800;0.6840;0.8033;0.8073;1" values="0;0;1;1;0;0"/></g><g class="card"><rect x="20" y="120" width="190" height="150" rx="12" class="box"/><circle cx="40" cy="120" r="10.5" fill="url(#brand)"/><text x="40" y="124.2" class="num">1</text><text x="34" y="148" class="title" style="font-size:14.5px">Main agent</text><text x="34" y="170" class="sub">one tool:</text><text x="34" y="187" class="sub">delegate(agent, task)</text><text x="34" y="204" class="sub">or you type /ask</text><text x="34" y="221" class="sub">or @name</text><text x="34" y="238" class="sub">shares stop and approver</text></g><g class="card"><rect x="420" y="60" width="440" height="92" rx="12" class="box"/><circle cx="440" cy="60" r="10.5" fill="url(#brand)"/><text x="440" y="64.2" class="num">2</text><text x="434" y="88" class="title" style="font-size:14.5px">workflow</text><text x="434" y="110" class="sub">another OVAT workflow, in this process, with a fresh</text><text x="434" y="127" class="sub">context; it cannot delegate again (one level deep)</text></g><g class="card tool"><rect x="420" y="176" width="440" height="92" rx="12" class="box"/><circle cx="440" cy="176" r="10.5" fill="url(#brand)"/><text x="440" y="180.2" class="num">3</text><text x="434" y="204" class="title" style="font-size:14.5px">api</text><text x="434" y="226" class="sub">any OpenAI-compatible API: a cloud model, a remote OVMS;</text><text x="434" y="243" class="sub">asks first, shows where the task goes; enable_thinking: false</text></g><g class="card"><rect x="420" y="292" width="440" height="92" rx="12" class="box"/><circle cx="440" cy="292" r="10.5" fill="url(#brand)"/><text x="440" y="296.2" class="num">4</text><text x="434" y="320" class="title" style="font-size:14.5px">a2a</text><text x="434" y="342" class="sub">another agent over A2A, in another terminal or machine;</text><text x="434" y="359" class="sub">asks first unless it is on this PC; framed as information</text></g><g class="card ok"><rect x="20" y="316" width="190" height="80" rx="12" class="box"/><circle cx="40" cy="316" r="10.5" fill="url(#brand)"/><text x="40" y="320.2" class="num">5</text><text x="34" y="344" class="title" style="font-size:14.5px">/agents</text><text x="34" y="366" class="sub">a live table of calls;</text><text x="34" y="383" class="sub">x cancels one child</text></g><text x="20" y="438" class="small">Enable a workflow, api or a2a subagent in the subagents: list; see examples/agent/ for a workflow with all three.</text></svg>
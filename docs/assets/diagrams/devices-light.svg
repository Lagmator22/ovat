600;0.7100;0.7301;1.0000" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="10.5" fill="var(--accent)" opacity="0.22"/><circle r="4.5" fill="var(--accent)"/><circle r="1.8" fill="#fff" opacity="0.9"/><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.5400;0.7000;0.7300;1.0000" keyPoints="0.0000;0.0000;1.0000;1.0000;1.0000" path="M310 242 C455 242 455 304 600 304"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5399;0.5600;0.7100;0.7301;1.0000" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="10.5" fill="var(--accent)" opacity="0.22"/><circle r="4.5" fill="var(--accent)"/><circle r="1.8" fill="#fff" opacity="0.9"/><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0400;0.2000;0.2300;1.0000" keyPoints="0.0000;0.0000;1.0000;1.0000;1.0000" path="M310 318 C455 318 455 300 600 300"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0399;0.0600;0.2100;0.2301;1.0000" values="0;0;1;1;0;0"/></g><g class="fx" opacity="0"><circle r="10.5" fill="var(--accent)" opacity="0.22"/><circle r="4.5" fill="var(--accent)"/><circle r="1.8" fill="#fff" opacity="0.9"/><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.5400;0.7000;0.7300;1.0000" keyPoints="0.0000;0.0000;1.0000;1.0000;1.0000" path="M310 318 C455 318 455 300 600 300"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.5399;0.5600;0.7100;0.7301;1.0000" values="0;0;1;1;0;0"/></g><g class="card"><rect x="20" y="60" width="290" height="60" rx="12" class="box"/><text x="34" y="85" class="title" style="font-size:14.5px">Agent model</text><text x="34" y="105" class="sub">the LLM that calls tools</text></g><g class="card"><rect x="20" y="136" width="290" height="60" rx="12" class="box"/><text x="34" y="161" class="title" style="font-size:14.5px">Vision</text><text x="34" y="181" class="sub">describe_image, follows the LLM</text></g><g class="card"><rect x="20" y="212" width="290" height="60" rx="12" class="box"/><text x="34" y="237" class="title" style="font-size:14.5px">Embeddings</text><text x="34" y="257" class="sub">search_docs and ovat index</text></g><g class="card"><rect x="20" y="288" width="290" height="60" rx="12" class="box"/><text x="34" y="313" class="title" style="font-size:14.5px">Speech to text</text><text x="34" y="333" class="sub">transcribe, small enough for CPU</text></g><g class="chip" opacity="1"><rect x="593" y="74" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="593" y="87" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="593" y="100" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="593" y="113" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="593" y="126" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="74" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="87" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="100" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="113" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="126" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="600" y="60" width="260" height="80" rx="10" class="box2"/><rect x="612" y="72" width="56" height="56" rx="8" fill="url(#brand)"/><text x="640" y="105" class="num" style="font-size:15px">GPU</text><text x="684" y="96" class="title" style="font-size:14.5px">GPU</text><text x="684" y="115" class="sub">integrated Intel Arc</text></g><g class="chip" opacity="1"><rect x="593" y="174" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="593" y="187" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="593" y="200" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="593" y="213" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="593" y="226" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="174" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="187" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="200" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="213" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="226" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="600" y="160" width="260" height="80" rx="10" class="box2"/><rect x="612" y="172" width="56" height="56" rx="8" fill="url(#brand)"/><text x="640" y="205" class="num" style="font-size:15px">NPU</text><text x="684" y="196" class="title" style="font-size:14.5px">NPU</text><text x="684" y="215" class="sub">Intel AI Boost</text></g><g><rect x="593" y="274" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="593" y="287" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="593" y="300" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="593" y="313" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="593" y="326" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="274" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="287" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="300" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="313" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="860" y="326" width="7" height="5" rx="1.5" style="fill:var(--line)"/><rect x="600" y="260" width="260" height="80" rx="10" class="box2"/><rect x="612" y="272" width="56" height="56" rx="8" fill="url(#brand)"/><text x="640" y="305" class="num" style="font-size:15px">CPU</text><text x="684" y="296" class="title" style="font-size:14.5px">CPU</text><text x="684" y="315" class="sub">always there, the fallback</text></g><path d="M20 372H52" class="solid" style="stroke:var(--accent);stroke-width:2"/><text x="60" y="376" class="small">default route</text><path d="M160 372H192" class="link"/><text x="200" y="376" class="small">fallback when that device is missing</text><text x="20" y="400" class="small">The LLM can run on the NPU too, from a -int4-cw-ov export. A tool-calling run on the NPU was measured on a LunarLake AI PC.</text><text x="20" y="418" class="small">ovat init writes the LLM's device into workflow.yml. A device you set in the file always wins.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-labelledby="t d"><title id="t">Device routing on CPU, GPU and NPU</title><desc id="d">On an AI PC the agent model and vision go to the GPU, embeddings to the NPU, and speech to text to the CPU. On a machine with only a CPU, everything runs on the CPU. The LLM can also run on the NPU from a -int4-cw-ov export.</desc><style>
svg{--text:#1F2328;--sub:#57606A;--card:#FFFFFF;--card2:#F6F8FA;--border:#D0D7DE;--line:#8C959F;--accent:#0068B5;--soft:rgba(0,104,181,0.08);--purple:#8F5CFF;--ok:#3DD68C;--oktext:#1A7F37;--warn:#FFC107;--warntext:#9A6700;--halo:rgba(0,104,181,0.22);--mono:#0068B5}
text{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;fill:var(--text)}
.title{font-weight:650}
.mono-title,.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace}
.mono{fill:var(--mono);font-size:13px}
.sub{fill:var(--sub);font-size:12.5px}
.small{fill:var(--sub);font-size:11.5px}
.cap{font-size:13px;font-weight:600;fill:var(--text)}
.num{fill:#fff;font-size:11.5px;font-weight:700;text-anchor:middle}
.box{fill:var(--card);stroke:var(--border);stroke-width:1.2}
.box2{fill:var(--card2);stroke:var(--border);stroke-width:1.2}
.group{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 5}
.link{fill:none;stroke:var(--line);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-ok{fill:none;stroke:var(--ok);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.link-purple{fill:none;stroke:var(--purple);stroke-width:1.6;stroke-dasharray:6 5;animation:flow 1.1s linear infinite}
.solid{fill:none;stroke:var(--line);stroke-width:1.6}
.hl{fill:var(--soft);stroke:url(#brand);stroke-width:4}
.page{fill:var(--card);stroke:var(--accent);stroke-width:1.5}
.pagelines{stroke:var(--accent);stroke-width:1.2;fill:none}
.arrowhead{fill:var(--line)}
@keyframes flow{to{stroke-dashoffset:-22}}
@keyframes pa{0.00%{opacity:1} 47.00%{opacity:1} 50.00%{opacity:0} 97.00%{opacity:0} 100.00%{opacity:1}}.pa{animation:pa 10s linear infinite}@keyframes pb{0.00%{opacity:0} 47.00%{opacity:0} 50.00%{opacity:1} 97.00%{opacity:1} 100.00%{opacity:0}}.pb{animation:pb 10s linear infinite}@keyframes ra{0.00%{opacity:1} 47.00%{opacity:1} 50.00%{opacity:0.12} 97.00%{opacity:0.12} 100.00%{opacity:1}}.ra{animation:ra 10s linear infinite}@keyframes rb{0.00%{opacity:0.4} 47.00%{opacity:0.4} 50.00%{opacity:1} 97.00%{opacity:1} 100.00%{opacity:0.4}}.rb{animation:rb 10s linear infinite}.rb{animation:rb 10s linear infinite,flow 1.1s linear infinite}@keyframes chip{0.00%{opacity:1} 47.00%{opacity:1} 50.00%{opacity:0.3} 97.00%{opacity:0.3} 100.00%{opacity:1}}.chip{animation:chip 10s linear infinite}
@media (prefers-reduced-motion: reduce){.fx{display:none}*{animation:none!important}}
</style><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0068B5"/><stop offset="0.55" stop-color="#00C7FD"/><stop offset="1" stop-color="#8F5CFF"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs><text x="20" y="32" class="cap pa" opacity="1">On an AI PC with a CPU, GPU and NPU</text><text x="20" y="32" class="cap pb" opacity="0">On a laptop or Mac with only a CPU</text><text x="860" y="32" class="small" text-anchor="end">the routing table ovat doctor shows</text><path d="M310 90C450 90 450 96 586 96" class="solid ra" opacity="1" style="stroke:var(--accent);stroke-width:2" marker-end="url(#arrow)"/><path d="M310 166C450 166 450 114 586 114" class="solid ra" opacity="1" style="stroke:var(--accent);stroke-width:2" marker-end="url(#arrow)"/><path d="M310 242C450 242 450 200 586 200" class="solid ra" opacity="1" style="stroke:var(--accent);stroke-width:2" marker-end="url(#arrow)"/><path d="M310 318C450 318 450 300 586 300" class="solid" style="stroke:var(--accent);stroke-width:2" marker-end="url(#arrow)"/><path d="M310 90C450 90 450 284 586 284" class="link rb" opacity="0.4" marker-end="url(#arrow)"/><path d="M310 166C450 166 450 294 586 294" class="link rb" opacity="0.4" marker-end="url(#arrow)"/><path d="M310 242C450 242 450 304 586 304" class="link rb" opacity="0.4" marker-end="url(#arrow)"/><g class="fx" opacity="0"><circle r="10.5" fill="var(--accent)" opacity="0.22"/><circle r="4.5" fill="var(--accent)"/><circle r="1.8" fill="#fff" opacity="0.9"/><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0.0000;0.0400;0.2000;0.2300;1.0000" keyPoints="0.0000;0.0000;1.0000;1.0000;1.0000" path="M310 90 C455 90 455 96 600 96"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0.0000;0.0399;0.0600;0.2100;0.2301;1.0000" values="0;0;1;1;
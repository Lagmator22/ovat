<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="tproviders dproviders">
<title id="tproviders">The provider interfaces</title><desc id="dproviders">Four interfaces with their backends. LLMProvider: OVMS over the OpenAI SDK, which does tool calling, or openvino_genai in-process, which does not. EmbeddingsProvider: a local TextEmbeddingPipeline or OVMS /v3/embeddings. RetrieverProvider: sqlite-vec on disk or numpy in memory. VLMProvider: openvino_genai VLMPipeline.</desc>
